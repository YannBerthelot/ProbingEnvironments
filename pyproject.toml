[tool.poetry]
name = "probing_environments"
version = "0.5.0"
description = "Probing environments for RL/DeepRL algorithms debugging"
authors = ["Yann Berthelot <yannberthelot1@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
mypy-extensions = "^1.0.0"
pytest = "^7.4.0"
gymnasium = ">=1.2"
gymnax = {git = "https://github.com/YannBerthelot/gymnax.git"}
chex = "^0.1.91"


[tool.poetry.group.dev.dependencies]
isort = "^5.12.0"
stable-baselines3 = "^2.0.0"
pre-commit = "^2.20.0"
scriv = {extras = ["toml"], version = "^0.15.2"}
tox = "^3.25.1"
flake8 = "^7.0.0"
black = "^24.4.2"
coverage = {extras = ["toml"], version = "^7.5.0"}
mypy = "^1.10.0"


[tool.pylint]
adopts = ["--ignore==src/probing_environments/envs.py"]

[tool.black]
line-length = 88
preview = true
verbose = true

[tool.isort]
profile = "black"

[tool.flake8]
max-line-length = 88


[tool.tox]
legacy_tox_ini = """

[tox]
isolated_build = True
envlist =
    py312
    linting
    coverage

[testenv:testing]
allowlist_externals = poetry, pytest
skip_install = true
deps = pyproject.toml
changedir = {envtmpdir}  # Move elsewhere to ensure pytest doesn't run from source root.
commands =
    poetry install
    poetry run pytest {toxinidir}

[testenv:linting]
deps = pre-commit
commands = pre-commit run --all-files

[testenv:coverage]
allowlist_externals = poetry
skip_install = true
deps =
    coverage[toml]
    pyproject.toml
    pytest
commands =
    poetry install
    poetry run coverage run --source=probing_environments --branch -m pytest {toxinidir}
    poetry run coverage report -m --fail-under 75
    poetry run coverage xml -o {toxinidir}/coverage.xml

[gh-actions]
python =
    3.12: py312, coverage, linting
"""

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
