# A release, by hand, as ~/.claude/RELEASING.md describes it. Each job needs
# the one before it, so the first failure stops the release:
#
#   check    the version is X.Y.Z, its CHANGELOG entry is on the branch, its
#            tag does not exist, and the commit is the branch's head: main, or
#            release/X.Y for a patch to an older minor (scripts/release_check.py)
#   slow     the slowest test tiers green on this commit: the large tier always
#            runs here; CI (ci.yml) runs the others on every push to main, and
#            they run here too only if that run is missing or red
#   package  the wheel and sdist built once and checked installed, outside the
#            checkout, on the oldest and newest Python (package.yml)
#   tag      vX.Y.Z on the checked commit; tags come only from this workflow
#   publish  those exact files to PyPI by trusted publishing, from the pypi
#            environment, whose required reviewer approves the upload
#   docs     the tag's documentation deployed as the site's X.Y, and made the
#            default ("latest") when released from main (docs-deploy.yml)
#   verify   probing-environments==X.Y.Z installed back from PyPI and its
#            documented examples run; a failure opens an issue, and yanking is
#            the owner's call, never this workflow's
#
# PyPI's trusted publisher names this file, release.yml, and the pypi
# environment: renaming either stops publishing.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, X.Y.Z, with its "## [X.Y.Z]" CHANGELOG entry on this branch (main, or release/X.Y for a patch).
        required: true

permissions:
  contents: read

# One release at a time, and never cancelled halfway.
concurrency:
  group: release
  cancel-in-progress: false

env:
  UV_VERSION: "0.13.6"

jobs:
  check:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      green: ${{ steps.slow.outputs.green }}
      minor: ${{ steps.slow.outputs.minor }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true
    - name: Check the version, its CHANGELOG entry, its tag and the commit
      env:
        VERSION: ${{ inputs.version }}
      run: python3 scripts/release_check.py "$VERSION"
    # A push run of ci.yml on this commit that succeeded: its tests jobs ran
    # every tier but large, on both Pythons.
    - id: slow
      name: Look for a green CI run on this commit
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        VERSION: ${{ inputs.version }}
      run: |
        runs=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&status=success" -q '.workflow_runs[].id')
        green=false
        if [ -n "$runs" ]; then green=true; fi
        echo "green=$green" >> "$GITHUB_OUTPUT"
        echo "minor=${VERSION%.*}" >> "$GITHUB_OUTPUT"
        echo "CI green on $GITHUB_SHA: $green"

  slow:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UV_PYTHON: "3.14"
      JAX_PLATFORMS: cpu
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v5
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    - run: uv sync --frozen
    # CI never runs the large tier, so it runs here on every release; the
    # others run here only when CI has no green run on this commit. Exit code
    # 5 is pytest's "no tests collected": there are no large tests yet.
    - name: Run the large tier, and the others if CI is not green here
      env:
        GREEN: ${{ needs.check.outputs.green }}
      run: |
        if [ "$GREEN" = true ]; then
          uv run --no-sync pytest -q -m large || [ $? -eq 5 ]
        else
          uv run --no-sync pytest -q -m ""
        fi

  package:
    needs: [check, slow]
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ inputs.version }}

  tag:
    needs: [check, slow, package]
    if: always() && needs.package.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - env:
        VERSION: ${{ inputs.version }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git tag -a "v$VERSION" -m "ProbingEnvironments $VERSION" "$GITHUB_SHA"
        git push origin "v$VERSION"

  # Trusted publishing: PyPI accepts uploads from this workflow in the pypi
  # environment, so no token is stored anywhere. The files are the ones the
  # package job built and checked, not a rebuild.
  publish:
    needs: tag
    if: always() && needs.tag.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist
    - uses: astral-sh/setup-uv@v5
      with:
        version: ${{ env.UV_VERSION }}
    - run: uv publish --trusted-publishing always

  # The tag pushed with the default token starts no workflow, so the site's X.Y
  # is deployed from here, once the release is on PyPI. Only a release from
  # main becomes "latest": a patch to an older minor, from its release/X.Y
  # branch, must not take the default from the newer one.
  docs:
    needs: [check, publish]
    if: always() && needs.publish.result == 'success'
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/docs-deploy.yml
    with:
      ref: v${{ inputs.version }}
      version: ${{ needs.check.outputs.minor }}
      alias: ${{ github.ref == 'refs/heads/main' && 'latest' || '' }}

  # What a user installs: probing-environments[sb3]==X.Y.Z from PyPI, in a
  # fresh environment, retried while the index catches up, then the README's
  # examples and the smoke checks from the tag.
  verify:
    needs: publish
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    env:
      JAX_PLATFORMS: cpu
    steps:
    - uses: actions/checkout@v4
      with:
        ref: v${{ inputs.version }}
    - uses: astral-sh/setup-uv@v5
      with:
        version: ${{ env.UV_VERSION }}
    - name: Install the release from PyPI
      env:
        VERSION: ${{ inputs.version }}
      run: |
        cd "$RUNNER_TEMP"
        uv venv --python 3.14 env
        deadline=$((SECONDS + 1200))
        until uv pip install --python env/bin/python --no-cache "probing-environments[sb3]==$VERSION" pytest; do
          [ "$SECONDS" -lt "$deadline" ] || { echo "probing-environments $VERSION is not installable from PyPI after 20 minutes"; exit 1; }
          sleep 30
        done
        echo "$RUNNER_TEMP/env/bin" >> "$GITHUB_PATH"
    - name: Run the documented examples and the smoke checks on it
      run: |
        python -m pytest -q -p no:cacheprovider -m medium tests/test_readme.py
        python tests/release_smoke.py core
        python tests/release_smoke.py sb3
    - if: failure()
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ inputs.version }}
        RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        gh issue create --repo "${{ github.repository }}" \
          --title "probing-environments $VERSION from PyPI fails its check" \
          --body "The Release workflow published probing-environments $VERSION, but installing it from PyPI or running its documented examples failed: $RUN. Whether to yank it is the owner's call."
