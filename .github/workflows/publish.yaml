name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.3

      - name: Configure poetry
        env:
          # ``poetry config pypi-token.pypi`` takes ONE argument: the
          # token value. The "__token__" username is implicit when using
          # an API token. Passing both as positional args fails with
          # "Expected only one argument (token), got 2".
          pypi_token: ${{ secrets.PYPI_TOKEN }}
        run: poetry config pypi-token.pypi "$pypi_token"

      - name: Build and publish
        run: poetry publish --build --no-interaction --skip-existing
