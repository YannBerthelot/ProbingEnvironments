[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "probing-environments"
dynamic = ["version"]  # derived from git tags by hatch-vcs
description = "Probing environments for RL/DeepRL algorithms debugging"
authors = [{ name = "Yann Berthelot", email = "yannberthelot1@gmail.com" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["reinforcement-learning", "debugging", "testing", "gymnax", "jax"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    # One per supported version (requires-python): the README's Python badge
    # reads these.
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# gymnax 1.0.1 supports Python < 3.15.
requires-python = ">=3.11,<3.15"
dependencies = [
    # 1.0 is required, not merely preferred: the envs implement
    # ``is_terminated``, which only the 1.0 base class dispatches to (0.0.9
    # calls ``is_terminal``), and gymnax 1.0's six-value step API reports the
    # time limit as ``truncated`` rather than folding it into ``done``.
    "gymnax>=1.0,<2",
    "gymnasium>=1.2",
    # Imported directly by the envs and checks, so declared rather than left
    # to arrive through gymnax. The jax floor is the lowest the other floors
    # allow: chex 0.1.91 needs jaxlib >= 0.7 (the compatibility job's lowest
    # resolution).
    "jax>=0.7",
    "flax>=0.10",
    "numpy>=1.26",
    "chex>=0.1.91",
    "mypy-extensions>=1.0",
    # gymnax 1.0.1 imports six (gymnax/utils/load_mnist.py, loaded by
    # ``import gymnax``) without declaring it; nothing else in a fresh install
    # brings it any more, so ``import probing_environments`` would fail.
    "six>=1.16",
]

[project.optional-dependencies]
# The premade Stable-Baselines3 adaptor (probing_environments.adaptors.sb3).
sb3 = ["stable-baselines3>=2.0"]

[project.urls]
Documentation = "https://yannberthelot.github.io/ProbingEnvironments/"
Source = "https://github.com/YannBerthelot/ProbingEnvironments"
Changelog = "https://github.com/YannBerthelot/ProbingEnvironments/blob/main/CHANGELOG.md"

[dependency-groups]
test = [
    "pytest>=7.4",
    "coverage[toml]>=7.5",
]
lint = [
    "pre-commit>=2.20",
    "black>=24.4.2",
    "isort>=5.12",
    "flake8>=7.0",
    "mypy>=1.10",
]
docs = [
    "mkdocs-material>=9.5",
    "mike==2.2.0",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    # The checks' own tests train Stable-Baselines3 agents.
    "probing-environments[sb3]",
    # Declared explicitly, though stable-baselines3 already requires it: a
    # [tool.uv.sources] entry only binds to a direct dependency, and the one
    # below routes Linux to the CPU wheel.
    "torch>=2.0",
]

[tool.uv]
default-groups = ["dev"]
# The platforms the project is developed and tested on: the lock must hold
# wheels for both. Without this, the compatibility job's lowest resolution
# picked torch 2.3.0 from the CPU index, whose plain (no "+cpu") wheels are
# aarch64-only, so CI's x86_64 runner had nothing to install.
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

# stable-baselines3 pulls torch, and torch's default Linux wheel drags in the
# whole CUDA runtime -- about 3 GB of nvidia-* wheels that every CPU-only CI
# job would download and never use. The CPU build is the same torch for these
# tests. `uv build --no-sources` keeps this out of the published metadata.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
# explicit: nothing resolves from here unless it is named above.
explicit = true

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/probing_environments"]

[tool.hatch.build.targets.sdist]
include = ["src/probing_environments", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Test sizes as in ~/.claude/TESTING.md: plain ``pytest`` runs the small tier;
# ``pytest -m "not large"`` (CI) adds the medium tier.
addopts = "-m 'not medium and not large' --durations=15"
markers = [
  "medium: trains an agent or runs the README examples; under 5 min",
  "large: network, real hardware or long training; under 15 min",
]

[tool.coverage.run]
source = ["probing_environments"]
branch = true

[tool.coverage.report]
fail_under = 75
show_missing = true

[tool.pylint]
adopts = ["--ignore==src/probing_environments/envs.py"]

[tool.black]
line-length = 88
preview = true
verbose = true

[tool.isort]
profile = "black"

[tool.flake8]
max-line-length = 88
